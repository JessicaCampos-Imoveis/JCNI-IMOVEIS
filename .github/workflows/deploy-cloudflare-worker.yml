name: Deploy Cloudflare Worker (OpenNext)

on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - "open-next.config.ts"
      - "next.config.ts"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jessica-campos-imoveis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jessica-campos-imoveis/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build OpenNext for Cloudflare
        run: SKIP_ENV_VALIDATION=1 npm run build:cf

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Smoke test
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} /\n" https://jcni.jessicacnegociosimobiliarios.workers.dev/
          curl -s -o /dev/null -w "HTTP %{http_code} /admin/login\n" https://jcni.jessicacnegociosimobiliarios.workers.dev/admin/login
          curl -s -o /dev/null -w "HTTP %{http_code} /sitemap.xml\n" https://jcni.jessicacnegociosimobiliarios.workers.dev/sitemap.xml
